<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Doom</title><style>body{margin:0;background:black;color:white;font:14px serif;display:grid;place-items:center;height:100vh}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}#status{position:absolute;padding:20px}button{padding:10px}</style></head><body><div id="status"><button id="start">Start Doom</button><p>Arrows: move · Ctrl: fire · Space: use · Enter: select</p></div><canvas tabindex="0" aria-label="Doom game"></canvas><script src="/emulators/emulators.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let ci;
document.querySelector('#start').onclick=async()=>{document.querySelector('#status').textContent='Loading Doom…';try{emulators.pathPrefix='/emulators/';const bytes=new Uint8Array(await(await fetch('/games/doom.jsdos')).arrayBuffer());ci=await emulators.dosboxWorker(bytes);ci.events().onFrameSize((w,h)=>{canvas.width=w;canvas.height=h});ci.events().onFrame((rgb,rgba)=>{let image=ctx.createImageData(canvas.width,canvas.height);if(rgba)image.data.set(rgba);else if(rgb){for(let i=0,j=0;i<rgb.length;i+=3,j+=4){image.data[j]=rgb[i];image.data[j+1]=rgb[i+1];image.data[j+2]=rgb[i+2];image.data[j+3]=255}}ctx.putImageData(image,0,0)});document.querySelector('#status').hidden=true;canvas.focus()}catch(e){document.querySelector('#status').textContent='Could not start Doom. Reload this window to try again.'}};
const keys={ArrowUp:265,ArrowDown:264,ArrowLeft:263,ArrowRight:262,Enter:257,Escape:256,Space:32,ControlLeft:341,ControlRight:345,ShiftLeft:340,AltLeft:342,Tab:258};for(const type of ['keydown','keyup'])addEventListener(type,e=>{const key=keys[e.code]||(/^Key[A-Z]$/.test(e.code)?e.code.charCodeAt(3):/^Digit/.test(e.code)?e.code.charCodeAt(5):0);if(key&&ci){e.preventDefault();ci.sendKeyEvent(key,type==='keydown')}});addEventListener('pagehide',()=>ci?.exit());
</script></body></html>
